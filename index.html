<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BigPeach</title>
<meta name="description" content="BigPeach のアプリと、各アプリのプライバシーポリシー。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #FFF9F0;
    --paper: #FFFFFF;
    --ink: #3B2F2C;
    --ink-faint: #7B6B63;
    --line: #F0E4D8;
    --rose: #D2325F;
    --ui: "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--ui);
    line-height: 1.85;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    width: 100%;
    max-width: 560px;
    padding: 56px 20px;
  }

  h1 {
    font-family: var(--serif);
    font-size: 30px;
    letter-spacing: 0.08em;
    margin: 0 0 6px;
  }

  .tagline {
    margin: 0 0 40px;
    color: var(--ink-faint);
    font-size: 14px;
  }

  h2 {
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--rose);
    font-weight: 700;
    margin: 0 0 14px;
  }

  .app {
    display: block;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px 24px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .app:hover {
    border-color: #E4CFC0;
    transform: translateY(-2px);
  }

  .app .name {
    font-family: var(--serif);
    font-size: 20px;
    margin: 0 0 4px;
  }

  .app .desc {
    margin: 0 0 14px;
    font-size: 14px;
    color: var(--ink-faint);
  }

  .app .link {
    font-size: 14px;
    font-weight: 500;
    color: var(--rose);
  }

  footer {
    margin-top: 48px;
    color: var(--ink-faint);
    font-size: 13px;
  }

  footer a {
    color: var(--ink-faint);
  }

  @media (max-width: 480px) {
    .wrap { padding: 40px 18px; }
    h1 { font-size: 25px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>BigPeach</h1>
  <p class="tagline">小さなアプリをつくっています。</p>

  <h2>Apps</h2>
  <a class="app" href="/pinkypromise/privacy/">
    <p class="name">PinkyPromise</p>
    <p class="desc">ゆびきりを証書にして残す、端末内で完結するアプリ。</p>
    <span class="link">プライバシーポリシー →</span>
  </a>

  <footer>
    <p>© 2026 株式会社Mouette<br>
    <a href="mailto:support@mouette.co.jp">support@mouette.co.jp</a></p>
  </footer>

</div>
</body>
</html>
